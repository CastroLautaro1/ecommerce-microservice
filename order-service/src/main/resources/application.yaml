server:
  port: 8084

spring:
  application:
    name: order-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update # Solo para desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc: # Configuracion para el guardado de las Reservas
          batch_size: 50
          order_inserts: true
          order_updates: true


application:
  services:
    catalog:
      url: ${CATALOG_SERVICE_URL}
    inventory:
      url: ${INVENTORY_SERVICE_URL}