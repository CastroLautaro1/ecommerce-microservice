server:
  port: 8084

spring:
  application:
    name: order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce-realm

      # Configuración como Cliente (Para enviar peticiones al Inventory-Service)
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/ecommerce-realm
        registration:
          order-service-client:
            provider: keycloak
            client-id: order-service
            client-secret: ${KEYCLOAK_ORDER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            # BLINDAJE: Fuerza el envío de credenciales en la cabecera (Estándar Keycloak)
            client-authentication-method: client_secret_post

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update # Solo para desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc: # Configuracion para el guardado de las Reservas
          batch_size: 50
          order_inserts: true
          order_updates: true


application:
  services:
    catalog:
      url: ${CATALOG_SERVICE_URL}
    inventory:
      url: ${INVENTORY_SERVICE_URL}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    # Sobreescritura del Identificador de Instancia (Elimina la dependencia de InetUtils)
    instance-id: localhost:${spring.application.name}:${server.port}