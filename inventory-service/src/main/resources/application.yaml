server:
  port: 8083

spring:
  application:
    name: inventory-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update # Solo para desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Permite descargar las llaves públicas de Keycloak
          issuer-uri: http://localhost:8080/realms/ecommerce-realm

feign:
  circuitbreaker:
    enabled: true # Integración nativa de Feign con Resilience4j

# Configuracion Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      catalogService: # Nombre de la instancia
        registerHealthIndicator: true
        slidingWindowSize: 10 # Evalua las ultimas 10 peticiones
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      catalogService:
        timeoutDuration: 2s # Fast-Fail: Si tarda mas de 2 segundos, lo cuenta como fallo

# Cliente de Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    # Sobreescritura del Identificador de Instancia (Elimina la dependencia de InetUtils)
    instance-id: localhost:${spring.application.name}:${server.port}