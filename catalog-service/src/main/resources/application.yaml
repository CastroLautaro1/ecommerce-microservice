server:
  port: 8081

spring:
  application:
    name: catalog-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update # Solo para desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  services:
    user:
      url: ${USER_SERVICE_URL}

feign:
  circuitbreaker:
    enabled: true # Integración nativa de Feign con Resilience4j

resilience4j:
  circuitbreaker:
    instances:
      userService: # Nombre de la instancia
        registerHealthIndicator: true
        slidingWindowSize: 10 # Evalua las ultimas 10 peticiones
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      userService:
        timeoutDuration: 2s # Fast-Fail: Si tarda mas de 2 segundos, lo cuenta como fallo