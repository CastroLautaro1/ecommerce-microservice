server:
  port: 8083

spring:
  application:
    name: inventory-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update # Solo para desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Permite descargar las llaves públicas de Keycloak
          issuer-uri: http://localhost:8080/realms/ecommerce-realm

# Cliente de Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    # Sobreescritura del Identificador de Instancia (Elimina la dependencia de InetUtils)
    instance-id: localhost:${spring.application.name}:${server.port}